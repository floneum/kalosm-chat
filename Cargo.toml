[package]
name = "kalosm-chat"
version = "0.1.0"
authors = ["Evan Almloff <evanalmloff@gmail.com>"]
edition = "2021"

[dependencies]
comrak = "0.40.0"
dioxus = { version = "0.7", features = ["router"] }
reqwest = "0.12.12"
kalosm-llama = { git = "https://github.com/floneum/kalosm" }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-timer = "0.2.5"
tracing = "0.1.44"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }

[features]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

# `wasm-timer` pulls in parking_lot 0.11 -> instant 0.1, whose `now()` is only
# implemented when the `wasm-bindgen` feature is on. Release builds prune the
# dead reference via LTO, but debug builds (e.g. `dx serve`) keep it and fail to
# link without this. Build-only; does not affect runtime behavior.
[target.'cfg(target_arch = "wasm32")'.dependencies]
instant = { version = "0.1", features = ["wasm-bindgen"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
